services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: squatter
      POSTGRES_PASSWORD: squatter
      POSTGRES_DB: squatter
    ports:
      # Host 5433 (5432 is often taken by another local Postgres); the api
      # container still reaches the db by service name on 5432 internally.
      - "5433:5432"
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory and want
      # the volume mounted at the parent (not .../data) so pg_upgrade can work.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squatter"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      # Override the .env DATABASE_URL to reach the db service by name.
      DATABASE_URL: postgres://squatter:squatter@db:5432/squatter?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
