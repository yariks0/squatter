name: Squatter
options:
  bundleIdPrefix: com.yarik
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Squatter:
    type: application
    platform: iOS
    sources:
      - Squatter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yarik.squatter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Squatter records your set with the camera (and LiDAR depth when available) to analyze your squat form."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FN6PPV4267
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Both configs use a base plist merged with the generated
        # INFOPLIST_KEY_* values. Debug's carries the cleartext-HTTP ATS
        # exception for the local backend; Release keeps default ATS (HTTPS
        # only). Both carry BGTaskSchedulerPermittedIdentifiers (background
        # analysis), which has no INFOPLIST_KEY_* build setting.
        Debug:
          INFOPLIST_FILE: Squatter/Info-Debug.plist
        Release:
          INFOPLIST_FILE: Squatter/Info-Release.plist
  SquatterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SquatterTests
    dependencies:
      - target: Squatter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Squatter:
    build:
      targets:
        Squatter: all
        SquatterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SquatterTests
